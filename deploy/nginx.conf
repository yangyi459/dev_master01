# ============================================================
# 悦芽口腔 · Nginx 站点配置（对应方案 §14 生产部署）
# ------------------------------------------------------------
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/yueya.conf
#   sudo ln -s /etc/nginx/sites-available/yueya.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 前置：gunicorn 在 127.0.0.1:8000 提供 API（见 gunicorn.service）；
#       前台/后台为静态产物，由 Nginx 托管两个子域。
# ⚠️ 把 yueya.example.com 全局替换为你的真实域名（建议 www + admin 两个子域）。
# ⚠️ SSL 证书路径按 certbot/你的签发方式调整。
# ============================================================

# ---------- HTTP 80 → 强制 HTTPS（证书签发期需临时放开，正式上线保持 301）----------
server {
    listen 80;
    server_name yueya.example.com www.yueya.example.com admin.yueya.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- 前台官网 www.yueya.example.com ----------
server {
    listen 443 ssl;
    server_name www.yueya.example.com;

    ssl_certificate     /etc/ssl/yueya/fullchain.pem;
    ssl_certificate_key /etc/ssl/yueya/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/yueya/frontend/dist;
    index index.html;

    # SPA history 路由回退（刷新子路由不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 上传媒体直出（仅限 uploads 子目录，避免通过 /media 暴露 api 源码）
    location /media/uploads/ {
        alias /var/www/yueya/api/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到 gunicorn（注意 proxy_pass 末尾不要加 /，保留 /api 前缀）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# ---------- 后台管理 admin.yueya.example.com ----------
server {
    listen 443 ssl;
    server_name admin.yueya.example.com;

    ssl_certificate     /etc/ssl/yueya/fullchain.pem;
    ssl_certificate_key /etc/ssl/yueya/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/yueya/backend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /media/uploads/ {
        alias /var/www/yueya/api/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
